name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_ENV: development
      CLIENT_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      MONGODB_URI: mongodb://localhost:27017/cruisin-test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      RAZORPAY_KEY_ID: test
      RAZORPAY_KEY_SECRET: test
      STRIPE_SECRET_KEY: test
      STRIPE_WEBHOOK_SECRET: test
      SENDGRID_API_KEY: SG.test
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      SHIPROCKET_ENABLED: 'true'
      SHIPROCKET_MODE: mock
      SHIPROCKET_ALLOW_LIVE_READS: 'false'
      SHIPROCKET_ALLOW_LIVE_MUTATIONS: 'false'
      SHIPROCKET_PICKUP_LOCATION: Mock Warehouse
      SHIPROCKET_PICKUP_POSTCODE: '560001'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run verify:logistics
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm --workspace server run db:indexes:production
        env:
          NODE_ENV: production
          APP_ENV: development
          MONGODB_URI: mongodb://localhost:27017/cruisin-logistics-indexes
          ALLOW_ISOLATED_INDEX_VALIDATION: 'true'
      - run: npm --workspace server run seed
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          NODE_ENV: development
          PLAYWRIGHT_PRODUCTION_SERVERS: 'true'
      - run: npm run test:e2e:logistics
