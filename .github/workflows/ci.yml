name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_ENV: test
  APP_ENV: development
  CLIENT_URL: http://127.0.0.1:3100
  ADMIN_URL: http://127.0.0.1:3101
  MONGODB_URI: mongodb://127.0.0.1:27017/cruisin-sync-order-analytics-tests
  REDIS_URL: redis://127.0.0.1:6379/14
  JWT_ACCESS_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  JWT_REFRESH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  CLOUDINARY_CLOUD_NAME: test
  CLOUDINARY_API_KEY: test
  CLOUDINARY_API_SECRET: test
  RAZORPAY_KEY_ID: rzp_test_ci
  RAZORPAY_KEY_SECRET: test
  RAZORPAY_WEBHOOK_SECRET: test
  STRIPE_SECRET_KEY: test
  STRIPE_WEBHOOK_SECRET: test
  SENDGRID_API_KEY: SG.test
  EMAIL_FROM: ci@example.test
  NEXT_PUBLIC_API_URL: http://127.0.0.1:8100/api/v1
  PLAYWRIGHT_API_URL: http://127.0.0.1:8100/api/v1
  PLAYWRIGHT_ADMIN_URL: http://127.0.0.1:3101
  PLAYWRIGHT_STOREFRONT_URL: http://127.0.0.1:3100
  SHIPROCKET_ENABLED: 'true'
  SHIPROCKET_MODE: mock
  SHIPROCKET_ALLOW_LIVE_READS: 'false'
  SHIPROCKET_ALLOW_LIVE_DOCUMENTS: 'false'
  SHIPROCKET_ALLOW_LIVE_MUTATIONS: 'false'
  SHIPROCKET_PICKUP_LOCATION: Mock Warehouse
  SHIPROCKET_PICKUP_POSTCODE: '560001'

jobs:
  quality:
    name: Quality, tests and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Start isolated transactional MongoDB
        run: |
          docker run -d --name cruisin-ci-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rsCi --bind_ip_all
          for attempt in $(seq 1 30); do
            docker exec cruisin-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' && break
            sleep 1
          done
          docker exec cruisin-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rsCi",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            docker exec cruisin-ci-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' && exit 0
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: node scripts/v2-secret-scan.mjs
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:logistics:focused
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run verify:logistics:secrets

  browser-e2e:
    name: Isolated production-server browser tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Start isolated transactional MongoDB
        run: |
          docker run -d --name cruisin-ci-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rsCi --bind_ip_all
          for attempt in $(seq 1 30); do
            docker exec cruisin-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' && break
            sleep 1
          done
          docker exec cruisin-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rsCi",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            docker exec cruisin-ci-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' && exit 0
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm --workspace server run db:indexes:production
        env:
          NODE_ENV: production
          APP_ENV: development
          MONGODB_URI: mongodb://localhost:27017/cruisin-logistics-indexes
          ALLOW_ISOLATED_INDEX_VALIDATION: 'true'
      - run: npm --workspace server run seed
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          NODE_ENV: development
          PLAYWRIGHT_PRODUCTION_SERVERS: 'true'
      - run: npm --workspace client run test:e2e:meta
      - run: npm run test:e2e:logistics
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
          retention-days: 7

  operations-e2e:
    name: Synthetic warehouse cross-application workflows
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PORT: 8192
      CLIENT_URL: http://127.0.0.1:3192
      ADMIN_URL: http://127.0.0.1:3193
      EMPLOYEE_URL: http://127.0.0.1:3194
      MONGODB_URI: mongodb://127.0.0.1:27017/cruisin-v2-operations-ci
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8192/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3192
      NEXT_PUBLIC_STOREFRONT_URL: http://127.0.0.1:3192
      API_PROXY_TARGET: http://127.0.0.1:8192
      PLAYWRIGHT_API_URL: http://127.0.0.1:8192/api/v1
      PLAYWRIGHT_ADMIN_URL: http://127.0.0.1:3193
      PLAYWRIGHT_EMPLOYEE_URL: http://127.0.0.1:3194
      SHIPROCKET_ENABLED: 'false'
      LOGISTICS_WORKER_ENABLED: 'false'
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Start isolated transactional MongoDB
        run: |
          docker run -d --name cruisin-ci-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rsCi --bind_ip_all
          for attempt in $(seq 1 30); do
            docker exec cruisin-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' && break
            sleep 1
          done
          docker exec cruisin-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rsCi",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            docker exec cruisin-ci-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' && exit 0
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm --workspace server run seed
        env:
          NODE_ENV: development
      - run: npx playwright install --with-deps chromium
      - name: Verify local warehouse workflows on built applications
        env:
          NODE_ENV: development
        run: |
          node server/dist/index.js > /tmp/operations-api.log 2>&1 & api_pid=$!
          NODE_ENV=production node node_modules/next/dist/bin/next start client -H 127.0.0.1 -p 3192 > /tmp/operations-client.log 2>&1 & client_pid=$!
          NODE_ENV=production node node_modules/next/dist/bin/next start admin -H 127.0.0.1 -p 3193 > /tmp/operations-admin.log 2>&1 & admin_pid=$!
          NODE_ENV=production node node_modules/next/dist/bin/next start employee -H 127.0.0.1 -p 3194 > /tmp/operations-employee.log 2>&1 & employee_pid=$!
          trap 'kill "$api_pid" "$client_pid" "$admin_pid" "$employee_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8192/health && curl -fsS -o /dev/null http://127.0.0.1:3192 && curl -fsS -o /dev/null http://127.0.0.1:3193/login && curl -fsS -o /dev/null http://127.0.0.1:3194/login; then break; fi
            sleep 1
          done
          npm --workspace employee run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: operations-browser-failure-artifacts
          path: employee/test-results
          retention-days: 7

  deployment-gate:
    name: Deployment gate
    if: always()
    needs: [quality, browser-e2e, operations-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          OPERATIONS_RESULT: ${{ needs.operations-e2e.result }}
        run: |
          echo "Quality result: $QUALITY_RESULT"
          echo "Browser result: $BROWSER_RESULT"
          test "$QUALITY_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$OPERATIONS_RESULT" = "success"
